<!-- Toast de Erro (Canto Superior Direito) -->
<div *ngIf="errorMessage" class="toast-error">
    <div class="toast-content">
        <span class="icon">⚠️</span>
        <span class="message">{{ errorMessage }}</span>
    </div>
    <button type="button" class="close-btn" (click)="errorMessage = null">✕</button>
</div>

<div class="login-container">
    <!-- Lado Esquerdo: Marca WenLock -->
    <div class="brand-section">
        <h1 class="logo">
            <span class="brand-blue">Wen</span><span class="brand-white">Lock</span><span class="brand-dot">.</span>
        </h1>
    </div>

    <!-- Lado Direito: Card de Login -->
    <div class="card-section">
        <div class="login-card">
            <h2 class="card-title">Bem-vindo!</h2>
            <p class="card-subtitle">Entre com sua conta</p>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <!-- Campo Usuário / E-mail -->
                <div class="form-group"
                    [class.has-error]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
                    <label
                        *ngIf="loginForm.get('username')?.value || (loginForm.get('username')?.touched && loginForm.get('username')?.invalid)">
                        Usuário
                    </label>
                    <input type="text" formControlName="username" placeholder="E-mail ou Nº matrícula" />
                    <small class="error-text"
                        *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
                        Campo Obrigatório
                    </small>
                </div>

                <!-- Campo Senha -->
                <div class="form-group"
                    [class.has-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                    <label
                        *ngIf="loginForm.get('password')?.value || (loginForm.get('password')?.touched && loginForm.get('password')?.invalid)">
                        Senha
                    </label>
                    <div class="input-password-wrapper">
                        <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                            placeholder="Senha" />
                        <button type="button" class="eye-toggle-btn" (click)="togglePasswordVisibility()">
                            <!-- Ícone dinâmico do olho -->
                            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                        </button>
                    </div>
                    <small class="error-text"
                        *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
                        Campo Obrigatório
                    </small>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>

                <div class="forgot-wrapper">
                    <a routerLink="/forgot-password" class="link-forgot">Esqueci minha senha</a>
                </div>
            </form>
        </div>
    </div>
</div>
