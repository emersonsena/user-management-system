<div class="pag-container">
    <h2 class="page-title">Usuários</h2>

    <!-- Barra de Pesquisa e Ações -->
    <div class="users-header">
        <div class="search-wrapper">
            <input type="text" class="search-input" placeholder="Pesquisa" [(ngModel)]="searchTerm"
                (ngModelChange)="onSearchChange()">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
            </svg>
        </div>
        <button class="btn-create" (click)="openCreateUser()">
            <span>+</span> Cadastrar Usuário
        </button>
    </div>

    <!-- Tabela de Usuários ou Mensagem Vazia -->
    <div class="users-container">
        <div *ngIf="paginatedUsers.length === 0" class="empty-state">
            <h3>Nenhum Usuário Registrado</h3>
            <p>Clique em "Cadastrar Usuário" para começar a cadastrar.</p>
        </div>

        <div *ngIf="paginatedUsers.length > 0" class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Matrícula</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let user of paginatedUsers">
                        <td>{{ user.name }}</td>
                        <td>{{ user.email }}</td>
                        <td>{{ user.registration }}</td>
                        <td class="actions">
                            <button class="btn-icon edit" (click)="editUser(user)" title="Editar">
                                ✏️
                            </button>
                            <button class="btn-icon delete" (click)="deleteUser(user.id)" title="Deletar">
                                🗑️
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Paginação -->
    <div class="pagination-footer">
        <span class="pagination-info">Total de Itens: <strong>{{ filteredUsers.length }}</strong></span>

        <div class="pagination-controls">
            <div class="items-per-page">
                <label>Itens por página</label>
                <select [(ngModel)]="itemsPerPage" (ngModelChange)="onPaginationChange()">
                    <option value="15">15</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>

            <div class="pagination-buttons">
                <button class="btn-pagination" (click)="firstPage()" [disabled]="currentPage === 1"
                    title="Primeira página">
                    ⟨⟨
                </button>
                <button class="btn-pagination" (click)="previousPage()" [disabled]="currentPage === 1"
                    title="Página anterior">
                    ⟨
                </button>

                <div class="page-numbers">
                    <button *ngFor="let page of getPageNumbers()" class="page-number"
                        [class.active]="page === currentPage" (click)="goToPage(page)">
                        {{ page }}
                    </button>
                </div>

                <button class="btn-pagination" (click)="nextPage()" [disabled]="currentPage === totalPages"
                    title="Próxima página">
                    ⟩
                </button>
                <button class="btn-pagination" (click)="lastPage()" [disabled]="currentPage === totalPages"
                    title="Última página">
                    ⟩⟩
                </button>
            </div>

            <span class="page-info">{{ currentPage }} de {{ totalPages }}</span>
        </div>
    </div>
</div>
