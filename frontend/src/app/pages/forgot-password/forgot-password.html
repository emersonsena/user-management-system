<!-- Toast de Erro Flutuante (Canto Superior Direito) -->
<div *ngIf="errorMessage" class="toast-error">
    <div class="toast-content">
        <span class="icon">⚠️</span>
        <span class="message">{{ errorMessage }}</span>
    </div>
    <button type="button" class="close-btn" (click)="errorMessage = null">✕</button>
</div>

<div class="forgot-container">
    <!-- Lado Esquerdo: Ilustração do Cadeado WenLock -->
    <div class="illustration-section">
        <div class="padlock-wrapper">
            <img src="images/img_recovery.svg" alt="Cadeado WenLock">
        </div>
    </div>

    <!-- Lado Direito: Card do Formulário -->
    <div class="card-section">
        <div class="forgot-card">
            <h1 class="logo">
                <span class="brand-blue">Wen</span><span class="brand-dark">Lock</span><span class="brand-dot">.</span>
            </h1>

            <h3 class="card-title">Recuperação de senha</h3>
            <p class="card-subtitle">Insira seu e-mail para recuperar sua senha.</p>

            <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
                <div class="form-group"
                    [class.has-error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid">
                    <input type="email" formControlName="email" placeholder="E-mail" />
                    <small class="error-text"
                        *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('required')">
                        Campo Obrigatório
                    </small>
                    <small class="error-text"
                        *ngIf="forgotForm.get('email')?.touched && forgotForm.get('email')?.hasError('email')">
                        Insira um e-mail válido
                    </small>
                </div>

                <button type="submit" class="btn-submit">Recuperar</button>

                <div class="back-wrapper">
                    <a routerLink="/login" class="link-back">
                        <span class="arrow">←</span> Voltar para o login
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Pop-up de Sucesso (E-mail enviado!) -->
<div *ngIf="showSuccessModal" class="modal-backdrop">
    <div class="modal-card">
        <div class="check-circle">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="#00AAC1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>

        <h3 class="modal-title">E-mail enviado!</h3>
        <p class="modal-text">Lhe enviamos um e-mail com um link para recuperação da sua senha.</p>

        <button type="button" routerLink="/login" class="btn-modal-continue">Continuar</button>
    </div>
</div>
