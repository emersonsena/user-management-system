<div class="app-layout">
    <!-- Sidebar / Menu Lateral Escuro -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">
                <span class="brand-blue">Wen</span><span class="brand-white">Lock</span><span class="brand-dot">.</span>
            </h1>
            <button class="collapse-btn" aria-label="Toggle Sidebar">
                <span>‹</span>
            </button>
        </div>

        <nav class="sidebar-nav">
            <!-- Item Home -->
            <a routerLink="/home" routerLinkActive="active" class="nav-item">
                <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>

            <!-- Submenu Controle de Acesso -->
            <div class="nav-group">
                <div class="nav-group-header" (click)="toggleAccessMenu()">
                    <div class="header-left">
                        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>Controle de Acesso</span>
                    </div>
                    <span class="arrow" [class.open]="isAccessMenuOpen">▾</span>
                </div>

                <div class="nav-subitems" *ngIf="isAccessMenuOpen">
                    <a routerLink="/users" routerLinkActive="active" class="nav-subitem">
                        <svg class="subnav-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span>Usuários</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Rodapé do Menu -->
        <footer class="sidebar-footer">
            <p class="copyright">© WenLock</p>
            <small class="powered-by">Power by Conecthus V 0.0.0</small>
        </footer>
    </aside>

    <!-- Área de Conteúdo Principal -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="user-menu" (click)="logout()" title="Clique para Sair">
                <div class="avatar-circle">{{ userInitials }}</div>
            </div>
        </header>

        <!-- Corpo da Página -->
        <div class="page-container">
            <h2 class="page-title">Home</h2>

            <div class="welcome-card">
                <h3 class="greeting">Olá {{ userName }}!</h3>
                <p class="date-text">{{ currentDate }}</p>

                <div class="illustration-wrapper">
                    <!-- Ilustração Vetorial WenLock -->
                    <img src="images/img_home.svg" alt="Imagem Home">
                </div>

                <div class="welcome-btn-wrapper">
                    <button type="button" class="btn-welcome-outline">Bem-vindo ao WenLock!</button>
                </div>
            </div>
        </div>
    </main>
</div>
